<section class="page-hero">
  <h1>Application</h1>
  <p>Value Chain Medical에 문의하세요.</p>
</section>

<div class="page-body">
  <form class="contact-form" onsubmit="return handleFormSubmit(event)">
    <div class="form-group">
      <label>Name<span class="required">*</span></label>
      <input type="text" class="form-control" name="name" required>
    </div>
    <div class="form-group">
      <label>기업명 / 직함<span class="required">*</span></label>
      <input type="text" class="form-control" name="company" required>
    </div>
    <div class="form-group">
      <label>Phone<span class="required">*</span></label>
      <div class="phone-wrap">
        <input type="tel" class="form-control" maxlength="4" name="phone1" required>
        <span class="sep">-</span>
        <input type="tel" class="form-control" maxlength="4" name="phone2" required>
        <span class="sep">-</span>
        <input type="tel" class="form-control" maxlength="4" name="phone3" required>
      </div>
    </div>
    <div class="form-group">
      <label>E-mail<span class="required">*</span></label>
      <input type="email" class="form-control" name="email" required>
    </div>
    <div class="form-group">
      <label>Inquiry<span class="required">*</span></label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="inquiry[]" value="마케팅 및 브랜딩 컨설팅"><span>마케팅 및 브랜딩 컨설팅</span></label>
        <label><input type="checkbox" name="inquiry[]" value="디자인 (상품 패키지 디자인, 회사소개서, 카달로그 등)"><span>디자인 (상품 패키지 디자인, 회사소개서, 카달로그 등)</span></label>
        <label><input type="checkbox" name="inquiry[]" value="화장품 제조 매니지먼트"><span>화장품 제조 매니지먼트</span></label>
        <label><input type="checkbox" name="inquiry[]" value="미용기기 및 뷰티 세미나 강의 요청"><span>미용기기 및 뷰티 세미나 강의 요청</span></label>
      </div>
    </div>
    <div class="form-group">
      <label>Information</label>
      <input type="file" class="form-control" name="file" style="padding:8px;">
    </div>
    <div class="form-group">
      <label>웹 사이트 또는 SNS 링크 등을 첨부해주세요.</label>
      <textarea class="form-control" rows="3" name="links"></textarea>
    </div>
    <button type="submit" class="btn-submit">Send</button>
  </form>
</div>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-contact">

    <div class="footer-bottom">

      <p class="footer-copyright">@Copyright Value Chain Medical 2024. All Rights Reserved.</p>
    </div>
  </div>
</footer>
